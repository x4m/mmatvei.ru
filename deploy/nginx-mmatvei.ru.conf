# mmatvei.ru — nginx
# Устанавливается в /etc/nginx/sites-available/mmatvei.ru
# + симлинк в /etc/nginx/sites-enabled/

# для проксирования WebSocket (Snake.io 3D)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name mmatvei.ru www.mmatvei.ru;

    # certbot webroot challenge (renewal-конфиг указывает на /home/mmm/js)
    location /.well-known/acme-challenge/ {
        root /home/mmm/js;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mmatvei.ru www.mmatvei.ru;

    ssl_certificate     /etc/letsencrypt/live/mmatvei.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mmatvei.ru/privkey.pem;

    root /home/mmm/js;
    index index.html;

    # не отдавать служебные файлы из git-репы
    location ~ /\.git { deny all; }
    location ~ \.(pem|py|bak)$ { deny all; }

    # Snake.io 3D — Node-сервер игры (HTTP + WebSocket) на 127.0.0.1:8080
    location = /snake3d { return 301 /snake3d/; }
    location /snake3d/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Neon Labyrinth (3D-шутер) — Node-сервер на 127.0.0.1:8081
    location = /shooter { return 301 /shooter/; }
    location /shooter/ {
        proxy_pass http://127.0.0.1:8081/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Дурак — общий стол на телевизоре и личные карты на телефонах/планшете
    location = /durak { return 301 /durak/; }
    location /durak/ {
        proxy_pass http://127.0.0.1:8082/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
